name: Documentation workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: False
      matrix:
        python: ['3.12']
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install linux system dependencies
        run: sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 glibc-tools libegl1

      - name: Install Tox
        run: pip install tox

      - name: Build documentation
        run: tox -e build_doc
        env:
          QT_QPA_PLATFORM: offscreen
