package:
  name: orange3
  version: {{ GIT_DESCRIBE_TAG }}

source:
  git_url: ../

build:
  number: 0
  entry_points:
    - orange-canvas = Orange.canvas.__main__:main

  osx_is_app: True

  script:
    - python -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    # keep in sync with [build-system] in pyproject.toml
    - python
    - cython >=3.0
    - numpy >=2.0
    - recommonmark
    - setuptools >=51.0
    - sphinx >=4.2.0,<8
    - myst-parser
    - wheel
    - trubar >=0.3.4
  run:
    # keep in sync with requirements-*.txt
    - python
    # requirements-gui.txt
    - orange-canvas-core >=0.2.9,<0.3a
    - orange-widget-base >=4.29.0
    - anyqt >=0.2.0
    - matplotlib-base >=3.2.0
    - pygments >=2.8.0
    - pyqtgraph >=0.13.1
    - qtconsole >=4.7.2
    # requirements-core.txt
    - baycomp >=1.0.2
    - bottleneck >=1.3.4
    - chardet >=3.0.2
    - httpx >=0.21.0,<1
    - joblib >=1.2.0
    - keyring
    - keyrings.alt
    - networkx
    - numpy >=1.21.0
    - openpyxl >=3.1.3
    - openTSNE >=0.6.2,!=0.7.0
    - packaging
    - pandas >=2.0.1
    - python-louvain >=0.13
    - pyyaml
    - requests
    - scikit-learn >=1.7,<1.10
    - scipy >=1.9
    - serverfiles
    - tzdata
    - xgboost >=1.7.4
    - xlrd >=1.2.0
    - xlsxwriter
    # conda only
    - python.app  # [osx]

test:
  # Python imports
  imports:
    - Orange
    - Orange.canvas.config

    - Orange.widgets
    - Orange.widgets.data
    - Orange.widgets.evaluate
    - Orange.widgets.model
    - Orange.widgets.unsupervised
    - Orange.widgets.visualize

    - Orange.classification
    - Orange.clustering
    - Orange.data
    - Orange.distance
    - Orange.evaluation
    - Orange.modelling
    - Orange.preprocess
    - Orange.projection
    - Orange.regression
    - Orange.statistics

  commands:
    - python -m unittest -v Orange.tests Orange.widgets.tests
    - orange-canvas --help

app:
  entry: orange-canvas
  summary: 'data visualization and data analysis tool'
  icon: ../distribute/icon-48.png

about:
  home: http://orange.biolab.si/
  license: GNU General Public License v3 or later (GPLv3+)
  summary: 'Orange, a component-based data mining framework.'
